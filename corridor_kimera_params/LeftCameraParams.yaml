%YAML:1.0
# TUM-VI corridor1 (512x512, 20 Hz) -- calibration from the dataset (as in OpenVINS config/tum_vi).
# T_BS: pose of this camera in the IMU (body) frame = inverse of Kalibr T_cam_imu.
# General sensor definitions.
camera_id: left_cam

# Sensor extrinsics wrt. the body-frame.
T_BS:
  cols: 4
  rows: 4
  data: [-0.9995250378696743, 0.0075019185074052044, -0.02989013031643309, 0.04557483564969802,
         0.029615343885863205, -0.03439736061393144, -0.998969345370175, -0.07116180183799704,
         -0.008522328211654736, -0.9993800792498829, 0.03415885127385616, -0.044681254117144374,
         0.0, 0.0, 0.0, 1.0]

# Camera specific definitions.
rate_hz: 20
resolution: [512, 512]
camera_model: pinhole
intrinsics: [190.97847715128717, 190.9733070521226, 254.93170605935475, 256.8974428996504] # fu, fv, cu, cv
distortion_model: equidistant
distortion_coefficients: [0.0034823894022493434, 0.0007150348452162257, -0.0020532361418706202, 0.00020293673591811182]


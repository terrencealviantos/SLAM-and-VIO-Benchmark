%YAML:1.0
# TUM-VI corridor1 (512x512, 20 Hz) -- calibration from the dataset (as in OpenVINS config/tum_vi).
# T_BS: pose of this camera in the IMU (body) frame = inverse of Kalibr T_cam_imu.
# General sensor definitions.
camera_id: right_cam

# Sensor extrinsics wrt. the body-frame.
T_BS:
  cols: 4
  rows: 4
  data: [-0.9995110484978581, 0.008104079263822521, -0.030199136245891378, -0.05545633914259545,
         0.030299116376600627, 0.012511643720192351, -0.9994625667418545, -0.06925002164224772,
         -0.0077218830287333565, -0.9998888851620987, -0.012751072573940885, -0.047452864807513394,
         0.0, 0.0, 0.0, 1.0]

# Camera specific definitions.
rate_hz: 20
resolution: [512, 512]
camera_model: pinhole
intrinsics: [190.44236969414825, 190.4344384721956, 252.59949716835982, 254.91723064636983] # fu, fv, cu, cv
distortion_model: equidistant
distortion_coefficients: [0.0034003170790442797, 0.001766278153469831, -0.00266312569781606, 0.0003299517423931039]

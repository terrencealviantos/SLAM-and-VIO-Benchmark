%YAML:1.0

#--------------------------------------------------------------------------------------------
# Suedhoehe snow sequence: Intel RealSense D435i, infra1/infra2 at 848x480, 30 Hz, IMU 200 Hz.
#
# No calibration was recorded with this bag (no camera_info topic). Values below:
#  - Camera model "Rectified": /camera/infra*/image_rect_raw are already rectified by the
#    camera firmware, so no distortion is applied (as in ORB-SLAM3's RealSense_D435i.yaml).
#  - Stereo.b: D435i baseline from ORB-SLAM3's official RealSense_D435i.yaml (0.0499585 m).
#  - fx = fy = 421.35: measured from this bag. The RealSense depth image is computed with the
#    factory calibration, so depth * disparity(infra1, infra2) = fx * b. Median over 10 frames
#    across the run: fx * b = 21.05 px*m  ->  fx = 21.05 / 0.0499585 = 421.35 px.
#    (Cross-check: ORB-SLAM3's 640x480 value 382.6 px scaled to the 848x480 mode ~ 422 px.)
#  - cx, cy: image centre (nominal; not measurable from the bag).
#  - IMU.T_b_c1, IMU noise, IMU.Frequency: ORB-SLAM3's official RealSense_D435i.yaml. The
#    bag's IMU is in camera_imu_optical_frame, whose axes are aligned with the infra1 optical
#    frame, so the rotation is identity.
#--------------------------------------------------------------------------------------------
File.version: "1.0"

Camera.type: "Rectified"

Camera1.fx: 421.35
Camera1.fy: 421.35
Camera1.cx: 424.0
Camera1.cy: 240.0

Stereo.b: 0.0499585

Camera.width: 848
Camera.height: 480

Camera.fps: 30

# Color order of the images (0: BGR, 1: RGB. It is ignored if images are grayscale)
Camera.RGB: 0

# Close/Far threshold. Baseline times.
Stereo.ThDepth: 40.0

# Transformation from body-frame (IMU) to left camera (infra1)
IMU.T_b_c1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [1.0, 0.0, 0.0, -0.005,
          0.0, 1.0, 0.0, -0.005,
          0.0, 0.0, 1.0, 0.0117,
          0.0, 0.0, 0.0, 1.0]

# Do not insert keyframes when lost of visual tracking
IMU.InsertKFsWhenLost: 0

# IMU noise (ORB-SLAM3 RealSense_D435i.yaml)
IMU.NoiseGyro: 1e-3 # rad/s^0.5
IMU.NoiseAcc: 1e-2 # m/s^1.5
IMU.GyroWalk: 1e-6 # rad/s^1.5
IMU.AccWalk: 1e-4 # m/s^2.5
IMU.Frequency: 200.0

#--------------------------------------------------------------------------------------------
# ORB Parameters (ORB-SLAM3 RealSense_D435i.yaml)
#--------------------------------------------------------------------------------------------
ORBextractor.nFeatures: 1250
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0
